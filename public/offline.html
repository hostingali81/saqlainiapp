<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#145948">
    <title>Offline - SaqlainiApp</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
            background: #FFF8E7; color: #0D483B;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        img { width: 96px; height: 96px; border-radius: 50%; margin-bottom: 20px; }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 24px; max-width: 280px; line-height: 1.5; color: #4A3728; font-size: 15px; }
        button {
            height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
            background: #145948; color: #FFF8E7; font-size: 16px; font-weight: 600;
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <img src="/icons/icon-192x192.png" alt="SaqlainiApp">
    <h1>Internet nahi hai</h1>
    <p>Connection check karke dobara try karein. Connection aate hi app wapas chalne lagegi.</p>
    <button type="button" onclick="location.reload()">Dobara try karein</button>
    <script>
        // Come back by itself the moment the connection returns.
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
